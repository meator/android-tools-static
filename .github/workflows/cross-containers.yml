name: Build cross Docker containers

on:
  push:
    paths:
      - .github/workflows/cross-containers.yml
      - alpine-docker/config-aarch64.mak
      - alpine-docker/config-arm.mak
      - alpine-docker/config-armhf.mak
      - alpine-docker/config-base.mak
      - alpine-docker/config-powerpc64le.mak
      - alpine-docker/config-riscv64.mak
      - alpine-docker/config-i686.mak
      - alpine-docker/docker-bake.hcl
      - alpine-docker/save-versions.py
      - alpine-docker/universal.Dockerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build container

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        arch: [aarch64, arm, armhf, powerpc64le, riscv64, i686]

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/musl-cross-make-alpine-${{ matrix.arch }}

    steps:
      - name: Set up Docker Buildx
        # v4.2.0
        # The hash below **must** be kept up-to-date with the 'Build and push' action
        # below.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to the Container registry
        # v4.4.0
        # The hash below **must** be kept up-to-date with the 'Build and push' action
        # below.
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # v6.2.0
        # The hash below **must** be kept up-to-date with the 'Build and push' action
        # below.
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY-MM-DD'}},enable={{is_default_branch}},priority=1000

      - uses: actions/checkout@v7

      - name: Build and push
        # v7.3.0
        # The hash below **must** be kept up-to-date with the 'Build and push' action
        # below.
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        with:
          # The default git source pulls all submodules too, so use v6.8.0 instead.
          source: ./alpine-docker
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.arch }}
          # The hashes below **must** be kept up-to-date with the hashes above.
          set: |
            *.args.DOCKER_SETUP_BUILDX_ACTION_VERSION=bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
            *.args.DOCKER_LOGIN_ACTION_VERSION=af1e73f918a031802d376d3c8bbc3fe56130a9b0
            *.args.DOCKER_METADATA_ACTION_VERSION=dc802804100637a589fabce1cb79ff13a1411302
            *.args.DOCKER_BAKE_ACTION_VERSION=d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
          push: true

      # - name: Generate artifact attestation
      #   uses: actions/attest-build-provenance@v4
      #   with:
      #     subject-name: ${{ env.IMAGE_NAME }}
      #     # I don't know how to get the subject digest. See
      #     # https://github.com/docker/bake-action/issues/99
      #     subject-digest: 'sha256:fedcba0...'
      #     push-to-registry: true
