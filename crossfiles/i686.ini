[binaries]
cmake   = '/usr/bin/cmake'
c       = '/usr/local/bin/i686-linux-musl-gcc'
cpp     = '/usr/local/bin/i686-linux-musl-g++'
ar      = '/usr/local/bin/i686-linux-musl-ar'
nm      = '/usr/local/bin/i686-linux-musl-nm'
strip   = '/usr/local/bin/i686-linux-musl-strip'
readelf = '/usr/local/bin/i686-linux-musl-readelf'
objcopy = '/usr/local/bin/i686-linux-musl-objcopy'

[properties]
needs_exe_wrapper = false

[host_machine]
system = 'linux'
cpu_family = 'x86'
# The 'cpu' value may not be accurate, but that shouldn't
# be important.
cpu = 'x86'
endian = 'little'
